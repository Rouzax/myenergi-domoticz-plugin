name: Deploy docs

# Builds the docs with Zensical and publishes them to the gh-pages branch (GitHub Pages).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the publish step pushes the built site to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zensical
        run: python3 -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build
        run: zensical build --clean --strict

      # Replaces `mkdocs gh-deploy --force --no-history`, which Zensical does
      # not implement. force_orphan keeps gh-pages at a single commit, as
      # --no-history did.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
