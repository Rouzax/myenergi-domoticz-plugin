site_name: myenergi Monitor for Domoticz
site_description: >-
  A read-only-by-default Domoticz plugin for myenergi (zappi + harvi): true solar generation,
  EV charging, derived home consumption, grid flow, per-inverter power, and opt-in charger control.
site_author: Rouzax
site_url: https://rouzax.github.io/myenergi-domoticz-plugin/
repo_url: https://github.com/Rouzax/myenergi-domoticz-plugin
repo_name: Rouzax/myenergi-domoticz-plugin
copyright: Copyright &copy; 2026 Rouzax - not affiliated with myenergi

# Built with Zensical, which reads this mkdocs.yml natively. Material for
# MkDocs went into maintenance mode in November 2025; Zensical is the same
# team's successor. Keeping the config in mkdocs.yml rather than the native
# zensical.toml is deliberate: it is what the Zensical project itself does,
# and it keeps the build tool swappable.
#
# Zensical has no `-d` / `--site-dir` flag, so this key is the only thing that
# decides where the build lands, and docs.yml publishes exactly this path.
site_dir: site

theme:
  name: material
  icon:
    logo: material/ev-station
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

# Never publish the local-only planning docs. Only honoured by MkDocs;
# Zensical ignores exclude_docs, so .gitignore is the real guard, which keeps
# docs/superpowers/ out of the repo and therefore out of CI.
exclude_docs: |
  superpowers/

# Renders a small icon row in the footer of every page. Icon names resolve against
# the sets Zensical bundles under templates/.icons; an unknown name fails the
# build rather than rendering nothing.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/myenergi-domoticz-plugin
      name: myenergi Monitor on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/O0W221GBUG
      name: Support myenergi Monitor on Ko-fi

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: install.md
  - Settings: settings.md
  - Monitoring devices: devices.md
  - Charger control: control.md
  - How it works: internals.md
  - Security: security.md
  - Troubleshooting / FAQ: faq.md
  - About: about.md
